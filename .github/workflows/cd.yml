name: CD - Deploy to GKE

on:
  workflow_dispatch:

jobs:
 deploy:
  runs-on: ubuntu-latest

  permissions: 
    contents: read
    id-token: write
 
  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Authenticate to Google cloud
     uses: google-github-actions/auth@v2
     with:
      workload_identity_provider: projects/119344254072/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: github-actions@gcp-demo-508702.iam.gserviceaccount.com

   - name: Get GKE Credentials
     uses: google-github-actions/get-gke-credentials@v2
     with:
       cluster_name: demo-gke
       location: asia-south1-a

   - name: Deploy kubernetes manifests
     run: |
       kubectl apply -f k8s-specifications/
       
   - name: Verify deployments
     run: |
       kubectl get pods
       kubectl get services
       kubectl get deployments
