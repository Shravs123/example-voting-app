name: Build and Push docker Images

on:
  workflow_dispatch:

permissions: 
  contents: read
  id-token: write

env:
 PROJECT_ID: gcp-demo-508702
 REGION: asia-south1
 GAR_REPO: voting-app

jobs:
 build-and-push:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Authenticate to Google cloud
     uses: google-github-actions/auth@v2
     with:
      workload_identity_provider: projects/119344254072/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service-account: github-actions@gcp-demo-508702.iam.gserviceaccount.com

   - name: Set up Google Cloud SDK
     uses: google-github-actions/setup-gcloud@v2

   - name: Configure docker
     run: |
       gcloud auth configure-docker ${{env.REGION}}-docker.pkg.dev --quiet

   - name: Build and Push Vote Image
     run: |
       docker build \
         -t ${{env.REGION}}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/vote:${{ github.sha }} \
         ./vote

       docker push \
         ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/vote:${{ github.sha }}
   
    - name: Build and Push Result Image
     run: |
       docker build \
         -t ${{env.REGION}}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/result:${{ github.sha }} \
         ./vote

       docker push \
         ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/result:${{ github.sha }}     


    - name: Build and Push worker Image
     run: |
       docker build \
         -t ${{env.REGION}}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/worker:${{ github.sha }} \
         ./vote

       docker push \
         ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/worker:${{ github.sha }}       

      
