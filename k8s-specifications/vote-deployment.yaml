apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: asia-south1-docker.pkg.dev/gcp-demo-508702/voting-app/vote:8400f9210f8b50ea1e930e485d35c58f40fe55bf
        name: vote
        ports:
        - containerPort: 80
          name: vote
