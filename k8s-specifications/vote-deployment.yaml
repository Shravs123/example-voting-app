apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: asia-south1-docker.pkg.dev/gcp-demo-508702/voting-app/vote:343220d0036f96c37dc899a9bc6a28760fd24b93
        name: vote
        ports:
        - containerPort: 80
          name: vote
