apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: asia-south1-docker.pkg.dev/gcp-demo-508702/voting-app/vote:81c9864288696a56c4533d94e511f0d5afbaecbf
        name: vote
        ports:
        - containerPort: 80
          name: vote
